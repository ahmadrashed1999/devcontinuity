name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "The problem first, then the idea. Example: 'When Codex hits a limit I have to …'"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
