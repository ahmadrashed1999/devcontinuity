name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not paste transcripts, tokens or private paths**: DevContinuity handles your agents' history, and issues are public. Security problems go to [a private advisory](https://github.com/ahmadrashed1999/devcontinuity/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. npx devcontinuity\n2. Open Import Center\n3. …"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [npx devcontinuity, npm install -g devcontinuity, From source (npm run app), Windows tray, Docker demo]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevContinuity version
      description: "npx devcontinuity --version, or Settings → Security"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node.js version
      placeholder: "Windows 11, Node 22.12"
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Which agents are involved?
      multiple: true
      options: [Claude Code, Codex, OpenCode, Antigravity, Cline / Roo / Kilo, GitHub Copilot, Continue, Cursor, Windsurf, Gemini CLI, Aider, Zed, ChatGPT export, Claude.ai export, Qwen Code, Copilot CLI, Kiro, Other / none]
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: "Server output, or data/logs/orchestrator.log. Remove anything private."
      render: text
